[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-infra-optimization-lab"
version = "0.1.0"
description = "Multi-Objective Mixed-Integer Programming & Spatial Facility Location Lab for Transportation Infrastructure"
readme = "README.md"
authors = [{ name = "Dong-Yeon Chang", email = "dy.chang@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "streamlit>=1.35.0",
    "pydeck>=0.8.0",
    "plotly>=5.20.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0"
]
